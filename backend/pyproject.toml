[project]
name = "risk-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "dishka>=1.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.15",
  "redis>=5.2",
  "neo4j>=5.28",
  "argon2-cffi>=23.1",
  "stellarmesh-logging==0.5.1",
  "stellarmesh-objectstorage==0.1.0",
]

[dependency-groups]
dev = ["mypy>=1.15", "ruff>=0.11", "pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/risk_api"]
check_untyped_defs = true
ignore_missing_imports = true

