[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-comrisk"
version = "0.1.0"
description = "ComRisk-inspired enterprise graph risk research model"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "torch>=2.6,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.setuptools.packages.find]
include = ["comrisk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
