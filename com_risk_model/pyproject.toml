[project]
name = "com-risk-model"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncpg>=0.30",
  "com-risk-runtime",
  "pandas>=2.2,<4",
  "pyarrow>=19,<24",
  "scikit-learn>=1.6,<2",
  "sqlalchemy[asyncio]>=2.0",
  "stellarmesh-objectstorage==0.1.0",
  "torch>=2.6,<3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
com-risk-runtime = { path = "runtime", editable = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[dependency-groups]
dev = ["mypy>=1.15", "ruff>=0.11", "pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["runtime/src/com_risk_runtime", "training", "testing", "workbench"]
check_untyped_defs = true
ignore_missing_imports = true
