<polyline points="415,775 455,775" fill="none" stroke="#7354AD" stroke-width="2" />
<polygon points="455,775 445.0,771.0 445.0,779.0" fill="#7354AD"/>
<text x="467" y="781" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#7354AD">Opinion / conflict features</text>
<polyline points="855,775 895,775" fill="none" stroke="#B86A22" stroke-width="2" />
<polygon points="895,775 885.0,771.0 885.0,779.0" fill="#B86A22"/>
<text x="907" y="781" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#B86A22">Auxiliary evidence pathway</text>
<text x="40" y="823" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#526579">Implemented paths. The primary head does not consume fused probabilities; scalar fused uncertainty is a separate review baseline.</text>
</svg>
