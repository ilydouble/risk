<text x="1020" y="388" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#7354AD">C</text>
<polyline points="530,445 530,625" fill="none" stroke="#B86A22" stroke-width="2" />
<polygon points="530,625 534.0,615.0 526.0,615.0" fill="#B86A22"/>
<text x="544" y="549" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#B86A22">opinions + degree</text>
<polyline points="700,665 755,665" fill="none" stroke="#B86A22" stroke-width="2" />
<polygon points="755,665 745.0,661.0 745.0,669.0" fill="#B86A22"/>
