<polygon points="1090,665 1080.0,661.0 1080.0,669.0" fill="#B86A22"/>
<rect x="75" y="145" width="225" height="80" rx="10" fill="#FFFFFF" stroke="#087F8C" stroke-width="1.5"/>
<text x="187.5" y="175" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#087F8C">Shared backbone</text>
<text x="187.5" y="201" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#526579">Intrinsic + graph + hypergraph</text>
<rect x="380" y="145" width="285" height="80" rx="10" fill="#FFFFFF" stroke="#087F8C" stroke-width="1.5"/>
<text x="522.5" y="175" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#087F8C">Learned representation mix</text>
<text x="522.5" y="201" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#526579">Node and graph representations</text>
<rect x="750" y="145" width="250" height="80" rx="10" fill="#FFFFFF" stroke="#087F8C" stroke-width="1.5"/>
<text x="875.0" y="175" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#087F8C">Primary softmax head</text>
<text x="875.0" y="201" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#526579">Discriminative prediction</text>
<rect x="1090" y="145" width="320" height="80" rx="10" fill="#FFFFFF" stroke="#087F8C" stroke-width="1.5"/>
<text x="1250.0" y="175" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#087F8C">Probability calibration</text>
<text x="1250.0" y="201" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#526579">UK: isotonic / SMEsD: Platt</text>
<rect x="75" y="355" width="270" height="90" rx="10" fill="#FFFFFF" stroke="#7354AD" stroke-width="1.5"/>
<text x="210.0" y="385" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#7354AD">Evidential heads</text>
<text x="210.0" y="411" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#526579">Node + relation-conditioned</text>
<rect x="415" y="355" width="285" height="90" rx="10" fill="#FFFFFF" stroke="#7354AD" stroke-width="1.5"/>
<text x="557.5" y="385" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#7354AD">Opinion bundle</text>
<text x="557.5" y="411" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#526579">Node and relation opinions</text>
<rect x="755" y="355" width="245" height="90" rx="10" fill="#FFFFFF" stroke="#7354AD" stroke-width="1.5"/>
<text x="877.5" y="385" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#7354AD">Composite conflict C</text>
<text x="877.5" y="411" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#526579">Computed before discounting</text>
<rect x="1090" y="345" width="320" height="110" rx="10" fill="#FFFFFF" stroke="#7354AD" stroke-width="1.5"/>
<text x="1250.0" y="375" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#7354AD">Review score</text>
<text x="1250.0" y="401" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#526579">ambiguity(p) + gamma * C</text>
<text x="1250" y="428" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#7354AD">Defer the highest scores</text>
<text x="85" y="488" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#526579">Relation pooling includes self;</text>
<text x="85" y="514" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#526579">missing relations still yield opinions.</text>
<text x="755" y="488" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#526579">Shared representations:</text>
<text x="755" y="514" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#526579">opinions are not independent sources.</text>
<text x="1108" y="500" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#7354AD">Evaluate at matched review budgets</text>
<rect x="415" y="625" width="285" height="85" rx="10" fill="#FFFFFF" stroke="#B86A22" stroke-width="1.5"/>
<text x="557.5" y="655" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#B86A22">Conflict / degree discount</text>
<text x="557.5" y="681" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#526579">Applied to relation opinions</text>
<rect x="755" y="625" width="245" height="85" rx="10" fill="#FFFFFF" stroke="#B86A22" stroke-width="1.5"/>
<text x="877.5" y="655" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#B86A22">Dempster fusion</text>
<text x="877.5" y="681" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#526579">Then degree-based scaling</text>
<rect x="1090" y="625" width="320" height="85" rx="10" fill="#FFFFFF" stroke="#B86A22" stroke-width="1.5"/>
<text x="1250.0" y="655" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#B86A22">Auxiliary objective</text>
<text x="1250.0" y="681" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#526579">Fused evidence + KL regularization</text>
<text x="75" y="630" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#B86A22">Training coupling</text>
<text x="75" y="662" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#526579">Auxiliary losses update</text>
<text x="75" y="689" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#526579">shared model parameters.</text>
