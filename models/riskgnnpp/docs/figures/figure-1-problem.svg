<polyline points="720,297 825,355" fill="none" stroke="#7354AD" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="720" cy="277" r="32" fill="white" stroke="#172B40" stroke-width="2"/>
<text x="720" y="283" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#172B40">Firm</text>
<circle cx="595" cy="195" r="24" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="595" y="201" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2563eb">A</text>
<circle cx="850" cy="195" r="24" fill="white" stroke="#087F8C" stroke-width="2"/>
<text x="850" y="201" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#087F8C">B</text>
<circle cx="600" cy="367" r="24" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="600" y="373" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2563eb">C</text>
<circle cx="845" cy="367" r="24" fill="white" stroke="#7354AD" stroke-width="2"/>
<text x="845" y="373" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#7354AD">D</text>
