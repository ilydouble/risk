<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="45" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#172B40">Relational evidence: predicting status and deciding what to review</text>
