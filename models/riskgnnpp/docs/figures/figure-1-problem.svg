<text x="595" y="427" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#172B40">Shared address</text>
<polyline points="540,456 582,456" fill="none" stroke="#087F8C" stroke-width="2" />
<text x="595" y="462" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#172B40">Registered ownership</text>
<polyline points="540,491 582,491" fill="none" stroke="#7354AD" stroke-width="2" stroke-dasharray="7 5"/>
<text x="595" y="497" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#172B40">Name-based association</text>
<text x="540" y="545" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#526579">A recorded link need not imply similar risk.</text>
<polyline points="930,305 980,305" fill="none" stroke="#2563eb" stroke-width="2" />
<polygon points="980,305 970.0,301.0 970.0,309.0" fill="#2563eb"/>
<rect x="1010" y="155" width="360" height="100" rx="10" fill="#EDF8F7" stroke="#087F8C" stroke-width="1.5"/>
<text x="1190.0" y="185" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#087F8C">Predict corporate status</text>
<text x="1190.0" y="211" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#526579">Rank firms by distress probability</text>
<text x="1030" y="285" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#087F8C">Evaluate: average precision</text>
<rect x="1010" y="335" width="360" height="100" rx="10" fill="#F5F1FB" stroke="#7354AD" stroke-width="1.5"/>
<text x="1190.0" y="365" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#7354AD">Prioritize review</text>
<text x="1190.0" y="391" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#526579">Rank predictions by need for scrutiny</text>
<text x="1030" y="465" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#7354AD">Evaluate: retained error vs coverage</text>
<text x="1010" y="530" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#172B40">Research question:</text>
<text x="1010" y="556" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#172B40">Does conflict add error information?</text>
<text x="40" y="618" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#526579">Conceptual graph only. Dataset counts are observed; the additional value of conflict is the hypothesis under study.</text>
</svg>
