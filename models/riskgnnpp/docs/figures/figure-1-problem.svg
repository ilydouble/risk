<text x="532" y="115" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#172B40">(b) Corporate graph</text>
<rect x="980" y="80" width="420" height="500" rx="10" fill="#F6F8FB" stroke="#CFD8E3" stroke-width="1.5"/>
<text x="1002" y="115" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#172B40">(c) Two distinct decisions</text>
