<text x="250.0" y="185" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#2563eb">Companies House</text>
<text x="250.0" y="211" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#526579">Registry records and director attributes</text>
<rect x="70" y="260" width="360" height="80" rx="10" fill="#F0F5FF" stroke="#2563eb" stroke-width="1.5"/>
<text x="250.0" y="290" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#2563eb">GLEIF</text>
<text x="250.0" y="316" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#526579">Legal-entity records and relationships</text>
<text x="70" y="385" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#2563eb">233,251 firms</text>
<text x="70" y="425" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start" fill="#2563eb">412,348 directed edges</text>
<text x="70" y="475" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#172B40">Address-group split</text>
<text x="70" y="505" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#526579">Train / validation / test snapshots</text>
<text x="70" y="545" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#526579">Labels: contemporaneous registry status</text>
<polyline points="460,305 510,305" fill="none" stroke="#2563eb" stroke-width="2" />
<polygon points="510,305 500.0,301.0 500.0,309.0" fill="#2563eb"/>
