[project]
name = "uk-decision-runtime"
version = "0.1.0"
description = "Shared JevForge model loading and numerical buffer persistence"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.7.1", "jevforge==0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_decision_runtime"]
